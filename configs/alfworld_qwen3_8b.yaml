model:
  name: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  trust_remote_code: false
  attn_implementation: sdpa
  max_context_tokens: 4096
  dtype: bfloat16
  gradient_checkpointing: true
  distributed_timeout_seconds: 21600

generation:
  samples_per_action: 4
  micro_batch_size: 1
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9

judge:
  provider: openai_compatible
  model: "${JUDGE_MODEL:-Vendor3/DeepSeek-V4-Flash}"
  api_key_env: JUDGE_API_KEY
  base_url: "${JUDGE_BASE_URL:-https://api.gpugeek.com/v1}"
  timeout_seconds: 60
  max_retries: 3
  cache_path: outputs/alfworld_qwen3_8b/judge_cache.sqlite3

environment:
  config_path: configs/alfworld/base_config.yaml
  split: train
  max_steps_per_episode: 50
  excluded_actions: []
  max_candidate_actions: 0

acquisition:
  strategy: token_entropy
  uncertain_comparisons_are_distinct: true
  normalize_entropy: true

training:
  learning_rate: 1.0e-6
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  updates_per_mistake: 1
  update_gate: mistake_only
  warmup_updates: 20
  checkpoint_every_environment_steps: 100
  max_periodic_checkpoints_to_keep: 3
  resume_from: null

experiment:
  seed: 42
  output_dir: outputs/alfworld_qwen3_8b
  max_episodes: 100
  max_environment_steps: 2000
  stop_error_rate_threshold: null
  stop_error_rate_window: 200

evaluation:
  batch_size: 8
  max_transitions: 0
